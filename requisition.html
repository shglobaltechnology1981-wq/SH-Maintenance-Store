<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SH Store Requisition
</title>


<link rel="stylesheet" href="css/requisition.css">

</head>


<body>


<div class="container">


<h2>
SH Maintenance Store
</h2>


<h3>
Material Requisition
</h3>



<div class="user-box">

User :
<span id="userName"></span>

<br>

Department :
<span id="department"></span>


</div>




<div class="form-box">


<input 
type="text"
id="itemName"
placeholder="Item Name">



<input 
type="number"
id="qty"
placeholder="Required Qty">



<button type="button" onclick="addItem()">

Add Item

</button>



</div>





<table>


<thead>

<tr>

<th>SL</th>

<th>Item Name</th>

<th>Qty</th>

<th>Status</th>

</tr>

</thead>



<tbody id="reqTable">


</tbody>



</table>




<br>


<button type="button" onclick="saveRequisition()">

Save Requisition

</button>



<button type="button" onclick="logout()">

Logout

</button>



</div>





<script src="js/auth.js"></script>

<script src="js/requisition.js"></script>


</body>

</html>
