<!DOCTYPE html>
<html>

<head>

<title>SH Store Requisition</title>

<link rel="stylesheet" href="css/requisition.css">

</head>


<body>


<div class="container">


<h2>SH Maintenance Store</h2>

<h3>Material Requisition</h3>


<div class="user-box">

User :
<span id="userName"></span>

<br>

Department :
<span id="department"></span>

</div>



<div class="form-box">


<input id="itemName" placeholder="Item Name">

<input id="qty" placeholder="Required Qty" type="number">


<button onclick="addItem()">
Add Item
</button>


</div>



<table>

<thead>

<tr>

<th>SL</th>
<th>Item Name</th>
<th>Qty</th>
<th>Status</th>

</tr>

</thead>


<tbody id="reqTable">

</tbody>


</table>


<br>

<button onclick="saveRequisition()">
Save Requisition
</button>


<button onclick="logout()">
Logout
</button>



</div>



<script src="js/requisition.js"></script>

</body>

</html>
