<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH Maintenance Store | Stock</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ==========================
SIDEBAR
========================== -->

<div class="sidebar">

<div class="logo">

<img src="images/logo.png" alt="Logo">

<h2>SH STORE</h2>

</div>

<a href="dashboard.html">
<i class="fa fa-home"></i>
Dashboard
</a>

<a href="stock.html" class="active">
<i class="fa fa-box"></i>
Stock
</a>

<a href="purchase.html">
<i class="fa fa-cart-shopping"></i>
Purchase
</a>

<a href="issue.html">
<i class="fa fa-arrow-up"></i>
Issue
</a>

<a href="report.html">
<i class="fa fa-chart-bar"></i>
Report
</a>

<a href="#" onclick="logout()">
<i class="fa fa-right-from-bracket"></i>
Logout
</a>

</div>

<!-- ==========================
MAIN
========================== -->

<div class="main">

<div class="topbar">

<h1>Stock Management</h1>

<div class="top-right">

<span>

<i class="fa fa-user"></i>

<span id="loginUser"></span>

</span>

</div>

</div>

<!-- ==========================
FORM
========================== -->

<div class="form-box">

<h2 class="form-title">

Add New Item

</h2>

<div class="form-grid">

<input
type="text"
id="itemCode"
placeholder="Item Code">

<input
type="text"
id="itemName"
placeholder="Item Name">

<select id="itemCategory">

<option>Mechanical</option>

<option>Electrical</option>

<option>Boiler</option>

<option>Generator</option>

<option>Sewing Spare</option>

<option>Others</option>

</select>

<input
type="number"
id="itemStock"
placeholder="Stock Qty">

<input
type="text"
id="itemUnit"
placeholder="Unit (PCS)">

<button
class="btn btn-primary"
onclick="addItem()">

<i class="fa fa-plus"></i>

Add Item

</button>

</div>

</div>

<!-- ==========================
SEARCH
========================== -->

<div class="search-box">

<input
type="text"
id="searchItem"
placeholder="Search Item..."
onkeyup="searchItem()">

</div>

<!-- ==========================
TABLE
========================== -->

<div class="table-box">

<h3>

Stock List

</h3>

<table>

<thead>

<tr>

<th>Code</th>

<th>Item</th>

<th>Category</th>

<th>Stock</th>

<th>Unit</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="stockTable">

</tbody>

</table>

</div>

<div class="footer">

SH Maintenance Store Management System © 2026

</div>

</div>

<script src="js/auth.js"></script>

<script src="js/stock.js"></script>

</body>

</html>
