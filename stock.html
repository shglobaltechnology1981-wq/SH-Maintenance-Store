<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH Maintenance Store - Stock</title>

<link rel="stylesheet" href="css/stock.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h2>SH STORE</h2>

<a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a>

<a href="stock.html"><i class="fa fa-box"></i> Stock</a>

<a href="purchase.html"><i class="fa fa-cart-shopping"></i> Purchase</a>

<a href="issue.html"><i class="fa fa-arrow-up"></i> Issue</a>

<a href="report.html"><i class="fa fa-chart-bar"></i> Report</a>

</div>

<!-- Main -->

<div class="main">

<h1>Stock Management</h1>

<!-- Stock Form -->
<div class="search-box">

<input
type="text"
id="searchItem"
placeholder="Search Item..."
onkeyup="searchItem()">

</div>
  
<div class="stock-form">

<input
type="text"
id="itemCode"
placeholder="Item Code">

<input
type="text"
id="itemName"
placeholder="Item Name">

<select id="itemCategory">

<option value="Mechanical">Mechanical</option>

<option value="Electrical">Electrical</option>

<option value="Sewing Spare">Sewing Spare</option>

<option value="Boiler">Boiler</option>

<option value="Generator">Generator</option>

</select>

<input
type="number"
id="itemStock"
placeholder="Current Stock">

<input
type="text"
id="itemUnit"
placeholder="PCS">

<button onclick="addItem()">

<i class="fa fa-plus"></i>

Add Item

</button>

</div>

<!-- Stock Table -->

<table>

<thead>

<tr>

<th>Code</th>

<th>Item Name</th>

<th>Category</th>

<th>Stock</th>

<th>Unit</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="stockTable">

</tbody>

</table>

</div>

<script src="js/stock.js"></script>

<script src="js/auth.js"></script>


  
</body>

</html>
