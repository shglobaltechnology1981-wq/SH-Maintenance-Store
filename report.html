<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SH Maintenance Store | Report</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!--==================================
SIDEBAR
===================================-->

<div class="sidebar">

<div class="logo">

<img src="images/logo.png">

<h2>SH STORE</h2>

</div>

<a href="dashboard.html">

<i class="fa fa-home"></i>

Dashboard

</a>

<a href="stock.html">

<i class="fa fa-box"></i>

Stock

</a>

<a href="purchase.html">

<i class="fa fa-cart-shopping"></i>

Purchase

</a>

<a href="issue.html">

<i class="fa fa-arrow-up"></i>

Issue

</a>

<a href="report.html" class="active">

<i class="fa fa-chart-bar"></i>

Report

</a>

<a href="#" onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</a>

</div>

<!--==================================
MAIN
===================================-->

<div class="main">

<div class="topbar">

<h1>

Store Report

</h1>

<div class="top-right">

<span>

<i class="fa fa-user"></i>

<span id="loginUser"></span>

</span>

</div>

</div>

<!--==================================
SUMMARY
===================================-->

<div class="summary-box">

<div class="summary-card">

<h3>Total Items</h3>

<h2 id="rTotalItems">0</h2>

</div>

<div class="summary-card">

<h3>Total Stock</h3>

<h2 id="rTotalStock">0</h2>

</div>

<div class="summary-card">

<h3>Total Purchase</h3>

<h2 id="rTotalPurchase">0</h2>

</div>

<div class="summary-card">

<h3>Total Issue</h3>

<h2 id="rTotalIssue">0</h2>

</div>

</div>

<!--==================================
SEARCH
===================================-->

<div class="search-box">

<input
type="text"
id="searchReport"
placeholder="Search Report..."
onkeyup="searchReport()">

</div>

  <!--==================================
REPORT TABLE
===================================-->

<div class="table-box">

<h3>

Stock Report

</h3>

<div style="margin-bottom:15px;">

<button
class="btn btn-primary"
onclick="printReport()">

<i class="fa fa-print"></i>

Print Report

</button>


<button
class="btn btn-success"
onclick="exportExcel()">

<i class="fa fa-file-excel"></i>

Download Excel

</button>

</div>
<table>

<thead>

<tr>

<th>Item Code</th>

<th>Item Name</th>

<th>Category</th>

<th>Stock</th>

<th>Unit</th>

<th>Status</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<!--==================================
FOOTER
===================================-->

<div class="footer">

SH Maintenance Store Management System © 2026

</div>

</div>

<!--==================================
SCRIPTS
===================================-->
<script src="js/auth.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="js/report.js"></script>
</body>

</html>
