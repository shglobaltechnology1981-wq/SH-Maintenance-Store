<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SH STORE Report</title>


<link rel="stylesheet" href="css/report.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>



<div class="sidebar">


<h2>SH STORE</h2>


<a href="dashboard.html">
<i class="fa fa-home"></i>
Dashboard
</a>


<a href="stock.html">
<i class="fa fa-box"></i>
Stock
</a>


<a href="purchase.html">
<i class="fa fa-cart-shopping"></i>
Purchase
</a>


<a href="issue.html">
<i class="fa fa-arrow-up"></i>
Issue
</a>


<a href="report.html">
<i class="fa fa-chart-bar"></i>
Report
</a>


</div>






<div class="main">



<div class="topbar">


<h1>
Store Report
</h1>


<button onclick="window.print()">

<i class="fa fa-print"></i>

Print

</button>


</div>





<div class="summary">



<div class="box">

<h3>Total Items</h3>

<h2 id="rItems">0</h2>

</div>



<div class="box">

<h3>Total Stock</h3>

<h2 id="rStock">0</h2>

</div>



<div class="box">

<h3>Total Purchase</h3>

<h2 id="rPurchase">0</h2>

</div>



<div class="box">

<h3>Total Issue</h3>

<h2 id="rIssue">0</h2>

</div>



</div>







<h2>
Stock Report
</h2>


<table>


<thead>

<tr>

<th>Code</th>

<th>Name</th>

<th>Category</th>

<th>Stock</th>

<th>Unit</th>

</tr>

</thead>


<tbody id="stockReport">


</tbody>


</table>






<h2>
Purchase Report
</h2>


<table>


<thead>

<tr>

<th>Code</th>

<th>Name</th>

<th>Qty</th>

<th>Date</th>

</tr>


</thead>


<tbody id="purchaseReport">


</tbody>


</table>







<h2>
Issue Report
</h2>


<table>


<thead>

<tr>

<th>Code</th>

<th>Name</th>

<th>Qty</th>

<th>Issue To</th>

<th>Date</th>

</tr>


</thead>


<tbody id="issueReport">


</tbody>


</table>




</div>





<script src="js/report.js"></script>


</body>

</html>
