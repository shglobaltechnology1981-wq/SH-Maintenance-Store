<!DOCTYPE html>
<html>

<head>

<title>SH Store Issue Challan</title>

<link rel="stylesheet" href="css/issue-challan.css">

</head>


<body>


<div class="challan">


<h2>SH MAINTENANCE STORE</h2>

<h3>Material Issue Challan</h3>


<div class="info">

<p>
Issue No:
<span id="issueNo"></span>
</p>


<p>
Date:
<span id="issueDate"></span>
</p>


<p>
Department:
<span id="department"></span>
</p>

</div>



<table>


<thead>

<tr>

<th>SL</th>

<th>Item Name</th>

<th>Qty</th>

</tr>

</thead>


<tbody id="challanTable">


</tbody>


</table>



<br>


<button onclick="window.print()">

Print Challan

</button>


</div>


<script src="js/issue-challan.js"></script>


</body>

</html>
