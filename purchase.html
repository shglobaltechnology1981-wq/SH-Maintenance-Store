<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH Maintenance Store | Purchase</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!--==============================
SIDEBAR
==============================-->

<div class="sidebar">

<div class="logo">

<img src="images/logo.png">

<h2>SH STORE</h2>

</div>

<a href="dashboard.html">
<i class="fa fa-home"></i>
Dashboard
</a>

<a href="stock.html">
<i class="fa fa-box"></i>
Stock
</a>

<a href="purchase.html" class="active">
<i class="fa fa-cart-shopping"></i>
Purchase
</a>

<a href="issue.html">
<i class="fa fa-arrow-up"></i>
Issue
</a>

<a href="report.html">
<i class="fa fa-chart-bar"></i>
Report
</a>

<a href="#" onclick="logout()">
<i class="fa fa-right-from-bracket"></i>
Logout
</a>

</div>

<!--==============================
MAIN
==============================-->

<div class="main">

<div class="topbar">

<h1>Purchase Management</h1>

<div class="top-right">

<span>

<i class="fa fa-user"></i>

<span id="loginUser"></span>

</span>

</div>

</div>

<!--==============================
PURCHASE FORM
==============================-->

<div class="form-box">

<h2 class="form-title">

New Purchase

</h2>

<div class="form-grid">

<input
type="text"
id="purchaseCode"
placeholder="Item Code">

<input
type="number"
id="purchaseQty"
placeholder="Purchase Qty">

<input
type="text"
id="supplier"
placeholder="Supplier Name">

<button
class="btn btn-success"
onclick="purchaseItem()">

<i class="fa fa-save"></i>

Save Purchase

</button>

</div>

</div>

<!--==============================
PURCHASE TABLE
==============================-->

<div class="table-box">

<h3>

Purchase History

</h3>

<table>

<thead>

<tr>

<th>Item Code</th>

<th>Item Name</th>

<th>Quantity</th>

<th>Supplier</th>

<th>Date</th>

</tr>

</thead>

<tbody id="purchaseTable">

</tbody>

</table>

</div>

<div class="footer">

SH Maintenance Store Management System © 2026

</div>

</div>

<script src="js/auth.js"></script>

<script src="js/purchase.js"></script>

</body>

</html>
