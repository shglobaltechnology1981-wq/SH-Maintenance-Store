<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SH STORE Purchase</title>


<link rel="stylesheet" href="css/purchase.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<!-- SIDEBAR -->


<div class="sidebar">


<h2>SH STORE</h2>


<a href="dashboard.html">
<i class="fa fa-home"></i>
Dashboard
</a>


<a href="stock.html">
<i class="fa fa-box"></i>
Stock
</a>


<a href="purchase.html">
<i class="fa fa-cart-shopping"></i>
Purchase
</a>


<a href="issue.html">
<i class="fa fa-arrow-up"></i>
Issue
</a>


<a href="report.html">
<i class="fa fa-chart-bar"></i>
Report
</a>


</div>







<!-- MAIN -->


<div class="main">



<h1>
Purchase Management
</h1>





<div class="purchase-form">



<input
type="text"
id="purchaseCode"
placeholder="Item Code">



<input
type="number"
id="purchaseQty"
placeholder="Purchase Quantity">



<input
type="text"
id="supplierName"
placeholder="Supplier Name">



<input
type="date"
id="purchaseDate">





<button onclick="purchaseItem()">

<i class="fa fa-save"></i>

Save Purchase

</button>



</div>








<div class="table-box">


<h2>
Purchase History
</h2>




<table>


<thead>


<tr>

<th>Code</th>

<th>Item Name</th>

<th>Quantity</th>

<th>Supplier</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="purchaseTable">


</tbody>



</table>


</div>




</div>






<script src="js/purchase.js"></script>
<script src="js/auth.js"></script>



</body>

</html>
