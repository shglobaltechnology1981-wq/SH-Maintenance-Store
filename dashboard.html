<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SH STORE Dashboard</title>


<link rel="stylesheet" href="css/dashboard.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>



<!-- SIDEBAR -->

<div class="sidebar">


<h2>
<i class="fa fa-warehouse"></i>
SH STORE
</h2>



<a href="dashboard.html">
<i class="fa fa-home"></i>
Dashboard
</a>



<a href="stock.html">
<i class="fa fa-box"></i>
Stock
</a>



<a href="purchase.html">
<i class="fa fa-cart-shopping"></i>
Purchase
</a>



<a href="issue.html">
<i class="fa fa-arrow-up"></i>
Issue
</a>



<a href="report.html">
<i class="fa fa-chart-line"></i>
Report
</a>



</div>





<!-- MAIN -->


<div class="main">



<div class="topbar">


<h1>
Maintenance Dashboard
</h1>



<div class="date-time">

<span id="todayDate"></span>

<br>

<span id="clock"></span>


</div>


</div>







<!-- DASHBOARD CARDS -->


<div class="cards">



<div class="card">

<i class="fa fa-box"></i>

<h3>
Total Items
</h3>


<h2 id="totalItems">
0
</h2>


</div>





<div class="card">


<i class="fa fa-layer-group"></i>


<h3>
Total Stock
</h3>


<h2 id="totalStock">
0
</h2>


</div>







<div class="card">


<i class="fa fa-cart-plus"></i>


<h3>
Total Purchase
</h3>


<h2 id="totalPurchase">
0
</h2>


</div>







<div class="card">


<i class="fa fa-arrow-up"></i>


<h3>
Total Issue
</h3>


<h2 id="totalIssue">
0
</h2>


</div>





</div>







<!-- CHART SECTION -->


<div class="chart-box">


<h2>
Stock Movement Analysis
</h2>



<canvas id="stockChart"></canvas>



</div>







</div>







<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/auth.js"></script>



</body>

</html>
