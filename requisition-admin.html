<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SH Store | Requisition Management</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!--==================================
SIDEBAR
===================================-->

<div class="sidebar">

<div class="logo">

<img src="images/logo.png" alt="Logo">

<h2>SH STORE</h2>

</div>


<a href="dashboard.html">

<i class="fa fa-home"></i>

Dashboard

</a>


<a href="stock.html">

<i class="fa fa-box"></i>

Stock

</a>


<a href="purchase.html">

<i class="fa fa-cart-shopping"></i>

Purchase

</a>


<a href="issue.html">

<i class="fa fa-arrow-up"></i>

Issue

</a>


<a href="requisition.html">

<i class="fa fa-file-circle-plus"></i>

Requisition

</a>


<a href="requisition-admin.html"
class="active">

<i class="fa fa-list-check"></i>

Requisition Management

</a>


<a href="report.html">

<i class="fa fa-chart-bar"></i>

Report

</a>


<a href="#"
onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</a>

</div>



<!--==================================
MAIN
===================================-->

<div class="main">


<!--==================================
TOPBAR
===================================-->

<div class="topbar">

<h1>

Requisition Management

</h1>


<div class="top-right">

<span>

<i class="fa fa-user"></i>

<span id="loginUser"></span>

</span>

</div>

</div>



<!--==================================
SUMMARY
===================================-->

<div class="cards">


<div class="card">

<i class="fa fa-file-circle-plus"></i>

<h3>Total Requisition</h3>

<h2 id="totalReq">0</h2>

</div>


<div class="card">

<i class="fa fa-clock"></i>

<h3>Pending</h3>

<h2 id="pendingReq">0</h2>

</div>


<div class="card">

<i class="fa fa-circle-check"></i>

<h3>Approved</h3>

<h2 id="approvedReq">0</h2>

</div>


<div class="card">

<i class="fa fa-circle-xmark"></i>

<h3>Rejected</h3>

<h2 id="rejectedReq">0</h2>

</div>


</div>



<!--==================================
SEARCH
===================================-->

<div class="search-box">

<input

type="text"

id="searchReq"

placeholder="Search Requisition..."

onkeyup="searchRequisition()">

</div>



<!--==================================
REQUISITION TABLE
===================================-->

<div class="table-box">

<h3>

Requisition List

</h3>


<table>

<thead>

<tr>

<th>Req No</th>

<th>User</th>

<th>Department</th>

<th>Date</th>

<th>Items</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="requisitionTable">

</tbody>

</table>

</div>



<!--==================================
FOOTER
===================================-->

<div class="footer">

SH Maintenance Store Management System © 2026

</div>


</div>



<!--==================================
SCRIPTS
===================================-->

<script src="js/auth.js"></script>

<script src="js/requisition-admin.js"></script>


</body>

</html>
