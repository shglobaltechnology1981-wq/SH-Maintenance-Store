<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SH Maintenance Store | Requisition History</title>

<link rel="stylesheet"
href="css/requisition.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="container">


<h2>
SH Maintenance Store
</h2>


<h3>
Requisition History
</h3>


<!--==================================
TOP BUTTONS
===================================-->

<div style="margin-bottom:20px;">

<button onclick="window.location.href='requisition.html'">

<i class="fa fa-plus"></i>

New Requisition

</button>


<button onclick="window.location.href='dashboard.html'">

<i class="fa fa-home"></i>

Dashboard

</button>


<button onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</button>

</div>


<!--==================================
SEARCH
===================================-->

<div style="margin-bottom:15px;">

<input
type="text"
id="searchReq"
placeholder="Search Requisition..."
onkeyup="searchRequisition()"
style="width:100%;">

</div>


<!--==================================
REQUISITION TABLE
===================================-->

<table>

<thead>

<tr>

<th>SL</th>

<th>Requisition No</th>

<th>User</th>

<th>Department</th>

<th>Date</th>

<th>Time</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="historyTable">

</tbody>

</table>


</div>


<script src="js/auth.js"></script>

<script src="js/requisition-history.js"></script>


</body>

</html>
